# Production compose: pull-only image from GHCR (no git clone / no local build).
#
# .env PORT = host port published to the machine; app container always listens on 8000.
#
# First-time Telegram login (interactive, needs TTY):
#   docker compose pull
#   # edit .env: TELEGRAM_API_ID, TELEGRAM_API_HASH only; leave SESSION_STRING empty
#   docker compose --profile setup run --rm setup
#   # paste SESSION_STRING into .env, set CID, SECRET_KEY, admin password, then:
#   docker compose up -d

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${MYSQL_PASSWORD}}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-TelezonS3}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    image: ghcr.io/beihehele/telezon-s3:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  setup:
    profiles: ["setup"]
    image: ghcr.io/beihehele/telezon-s3:${IMAGE_TAG:-latest}
    env_file:
      - .env
    stdin_open: true
    tty: true
    entrypoint: ["python", "setup_account_storage.py"]

volumes:
  mysql_data:
