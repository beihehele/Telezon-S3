name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:

jobs:
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Build console SPA
        run: |
          npm ci
          npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (login page)
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/console/ >/dev/null && break; sleep 1; done
          CONSOLE_E2E_BASE=http://127.0.0.1:4173/console/ npx playwright test --grep "login page loads"

  test:
    runs-on: ubuntu-latest
    needs: [console]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify poetry.lock (MySQL era)
        run: python scripts/verify_poetry_lock.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry poetry-plugin-export
          poetry export -f requirements.txt --output requirements.txt --without-hashes
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx aiosqlite cryptography socksio "httpx[socks]"
      - name: Run tests
        env:
          PROJECT_NAME: telezon-test
          PORT: "8000"
          SECRET_KEY: telezon-ci-secret-key-16b
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          BOT_TOKEN: "0:test"
          CID: "123"
          TELEGRAM_API_ID: "1"
          TELEGRAM_API_HASH: hash
          SESSION_STRING: session
        run: pytest -q
