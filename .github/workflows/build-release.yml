name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack source archive
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          git archive \
            --format=tar.gz \
            --prefix="Telezon-S3-${VERSION}/" \
            -o "telezon-s3-${VERSION}-src.tar.gz" \
            HEAD
          git archive \
            --format=zip \
            --prefix="Telezon-S3-${VERSION}/" \
            -o "telezon-s3-${VERSION}-src.zip" \
            HEAD

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            telezon-s3-${{ steps.vars.outputs.version }}-src.tar.gz
            telezon-s3-${{ steps.vars.outputs.version }}-src.zip
            LICENSE
            README.md
            README.zh-CN.md
            CHANGELOG.md
            .env.example
            deploy/docker-compose.yml
            deploy/setup-telegram.sh
            deploy/setup-telegram.ps1
            docs/DEPLOY.zh-CN.md

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fill release notes
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
