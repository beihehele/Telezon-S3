[tool.poetry]
name = "telezons3"
version = "0.10.6"
description = ""
authors = ["Luis Ciber <luisciber640@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = { extras = ["standard"], version = "^0.115.4" }
pydantic = { extras = ["email"], version = "^2.9.2" }
bcrypt = "^4.2.0"
pyjwt = "^2.9.0"
python-dotenv = "^1.0.1"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
greenlet = "^3.1.0"
aiomysql = "^0.2.0"
python-telegram-bot = { extras = ["socks"], version = "^21.6" }
python-multipart = "^0.0.17"
pyrogram = "^2.0.106"
tgcrypto = "^1.2.5"
cryptography = "^44.0.0"
socksio = "^1.0.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.7.2"
boto3 = "^1.35.54"
typer = "^0.12.5"
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
aiosqlite = "^0.20.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
